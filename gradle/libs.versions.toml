[versions]
agp = "9.2.1"
kotlin = "2.3.20"
coroutines = "1.10.2"

# Compose
composeBom = "2026.04.01"
activityCompose = "1.13.0"

# AndroidX / lifecycle
coreKtx = "1.18.0"
lifecycle = "2.10.0"

# Networking + serialization
retrofit = "3.0.0"
okhttp = "5.3.2"
kotlinxSerializationJson = "1.11.0"

# Image loading
coil = "3.4.0"

# Media3 / ExoPlayer
media3 = "1.10.0"

# androidx.car.app — used ONLY for CarConnection (real Android Auto
# projection state). Gearhead MediaController connect/disconnect events
# are structurally unreliable as an "in the car" signal (legacy 5-min
# inactivity timeouts, background probes with no car attached), so the
# leave-vehicle pause is gated on projection state instead.
carApp = "1.4.0"

# Navigation
navigationCompose = "2.9.8"

# Drag-to-reorder for Compose LazyColumn
reorderable = "2.4.3"

# Auth — Credential Manager + Google Sign-In (no Firebase/google-services.json needed)
credentials = "1.5.0"
googleid = "1.1.1"

# Color extraction for cover-driven gradient backdrops
palette = "1.0.0"

# Glance — Compose-style API for AppWidgets (home-screen widgets).
glance = "1.1.1"

# Persistent key-value storage for auth state
datastorePreferences = "1.1.4"

# JVM unit tests. Robolectric supplies real android.os.Bundle / Looper so the
# playback engine can be driven by a real ExoPlayer instead of a hand-rolled
# fake — a fake would have to implement Timeline itself, since BasePlayer
# derives mediaItemCount and getMediaItemAt from it.
# Backports java.time (and friends) to API 24. Without it every java.time call
# is a NoClassDefFoundError on API 24-25, which minSdk still admits.
desugarJdkLibs = "2.1.5"

# Coverage measurement for the JVM unit-test suite.
kover = "0.9.1"

junit = "4.13.2"
# MediaPlayerApi is a wide Retrofit interface; a relaxed mock beats
# hand-writing a fake with a hundred unused members.
mockk = "1.14.2"
robolectric = "4.16"
androidxTestCore = "1.6.1"

googleGmsGoogleServices = "4.4.4"
firebaseAuth = "24.0.1"
firebaseCrashlytics = "20.0.5"
googleFirebaseCrashlytics = "3.0.7"

[libraries]
androidx-core-ktx                   = { module = "androidx.core:core-ktx",                                 version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx      = { module = "androidx.lifecycle:lifecycle-runtime-ktx",               version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose  = { module = "androidx.lifecycle:lifecycle-runtime-compose",           version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx    = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",             version.ref = "lifecycle" }

androidx-activity-compose           = { module = "androidx.activity:activity-compose",                    version.ref = "activityCompose" }
androidx-compose-bom                = { module = "androidx.compose:compose-bom",                          version.ref = "composeBom" }
androidx-compose-ui                 = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics        = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling         = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3          = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

kotlinx-coroutines-android          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",       version.ref = "coroutines" }
kotlinx-coroutines-guava            = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava",         version.ref = "coroutines" }
kotlinx-serialization-json          = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",       version.ref = "kotlinxSerializationJson" }

retrofit                            = { module = "com.squareup.retrofit2:retrofit",                       version.ref = "retrofit" }
retrofit-kotlinx-serialization      = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp                              = { module = "com.squareup.okhttp3:okhttp",                           version.ref = "okhttp" }
okhttp-logging                      = { module = "com.squareup.okhttp3:logging-interceptor",              version.ref = "okhttp" }

coil-compose                        = { module = "io.coil-kt.coil3:coil-compose",                         version.ref = "coil" }
coil-network-okhttp                 = { module = "io.coil-kt.coil3:coil-network-okhttp",                  version.ref = "coil" }

media3-exoplayer                    = { module = "androidx.media3:media3-exoplayer",                      version.ref = "media3" }
media3-exoplayer-okhttp             = { module = "androidx.media3:media3-datasource-okhttp",              version.ref = "media3" }
media3-session                      = { module = "androidx.media3:media3-session",                        version.ref = "media3" }
media3-common                       = { module = "androidx.media3:media3-common",                         version.ref = "media3" }
androidx-media3-common-ktx          = { module = "androidx.media3:media3-common-ktx",                     version.ref = "media3" }
# M10: disk cache + prefetch (SimpleCache + CacheDataSource + CacheWriter live in
# media3-datasource, which already comes in transitively via media3-exoplayer;
# media3-database hosts StandaloneDatabaseProvider for SimpleCache's index.
media3-database                     = { module = "androidx.media3:media3-database",                       version.ref = "media3" }
media3-ui                           = { module = "androidx.media3:media3-ui",                               version.ref = "media3" }

androidx-car-app                    = { module = "androidx.car.app:app",                                    version.ref = "carApp" }

androidx-navigation-compose         = { module = "androidx.navigation:navigation-compose",                version.ref = "navigationCompose" }

reorderable                         = { module = "sh.calvin.reorderable:reorderable",                       version.ref = "reorderable" }

androidx-credentials                = { module = "androidx.credentials:credentials",                         version.ref = "credentials" }
androidx-credentials-play-services  = { module = "androidx.credentials:credentials-play-services-auth",      version.ref = "credentials" }
googleid                            = { module = "com.google.android.libraries.identity.googleid:googleid",  version.ref = "googleid" }
androidx-datastore-preferences      = { module = "androidx.datastore:datastore-preferences",                 version.ref = "datastorePreferences" }
androidx-palette                    = { module = "androidx.palette:palette-ktx",                              version.ref = "palette" }
androidx-glance-appwidget           = { module = "androidx.glance:glance-appwidget",                            version.ref = "glance" }
androidx-glance-material3           = { module = "androidx.glance:glance-material3",                            version.ref = "glance" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version.ref = "firebaseAuth" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version.ref = "firebaseCrashlytics" }

desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
media3-test-utils = { module = "androidx.media3:media3-test-utils", version.ref = "media3" }
media3-test-utils-robolectric = { module = "androidx.media3:media3-test-utils-robolectric", version.ref = "media3" }
# Compose UI tests. Run on the JVM under Robolectric (no emulator): the
# BOM pins the version, so these carry no version.ref of their own.
androidx-compose-ui-test-junit4      = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest    = { module = "androidx.compose.ui:ui-test-manifest" }
# Swaps Coil's singleton loader for one that never touches the network,
# so a screen full of cover art doesn't turn tests into an I/O suite.
coil-test                           = { module = "io.coil-kt.coil3:coil-test", version.ref = "coil" }

[plugins]
kover                 = { id = "org.jetbrains.kotlinx.kover",                 version.ref = "kover" }
android-application   = { id = "com.android.application",                     version.ref = "agp" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",                version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",         version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization",   version.ref = "kotlin" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "googleGmsGoogleServices" }
google-firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "googleFirebaseCrashlytics" }
